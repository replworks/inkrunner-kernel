name: Build kernel

on:
  pull_request:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc make libelf-dev libssl-dev xz-utils binutils

      - name: Build vmlinux-arm64
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          source kernel.env
          {
            echo "Kernel: $(cat out/KERNEL_VERSION)"
            echo
            echo "- Source (GPL-2.0): $KERNEL_SOURCE_URL"
            echo "- Source SHA-256: \`$KERNEL_SOURCE_SHA256\`"
            echo "- Base config: https://github.com/apple/containerization/blob/$CONFIG_SOURCE_COMMIT/kernel/config-arm64"
            echo "- Resolved config: \`config-arm64.resolved\` in this release"
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            out/vmlinux-arm64 out/config-arm64.resolved out/SHA256SUMS
